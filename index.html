<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);min-height:100%}body{font-size:14px;-webkit-tap-highlight-color:transparent}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{outline:none;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}input:focus,select:focus,textarea:focus{border-color:#7b89de;box-shadow:0 0 0 3px #eef0ff}input[type=checkbox]{width:17px;height:17px;accent-color:var(--primary)}input[type=number]{font-variant-numeric:tabular-nums;min-width:0}button:focus-visible{outline:3px solid #c4cbfa;outline-offset:2px}.shell{max-width:570px;min-height:100vh;margin:0 auto;padding:22px 16px calc(90px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 15px}.brand{font-size:21px;font-weight:800;letter-spacing:-.7px}.muted{color:var(--sub)}.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.25px;color:#8c95aa;margin-bottom:4px}.btn{border:1px solid var(--line);border-radius:11px;padding:9px 12px;color:#4d5875;background:#fff;font-size:12px;font-weight:650}.btn.primary{background:var(--primary);color:white;border-color:var(--primary)}.btn.pale{background:var(--soft);border-color:transparent;color:#5161bf}.btn:active,.small-action:active{transform:translateY(1px)}.monthbar{display:flex;align-items:center;gap:7px;margin-bottom:14px}.monthbar .month-input{background:#fff;border:1px solid var(--line);padding:9px 11px;border-radius:12px;font-weight:750;flex:1;width:50px;text-align:center}.monthbar .arrow{background:#fff;border:1px solid var(--line);border-radius:11px;width:39px;height:39px;font-size:21px;line-height:1}.hero{border-radius:22px;background:#232e53;color:#fff;padding:22px 23px 21px;position:relative;overflow:hidden;margin-bottom:14px}.hero::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:linear-gradient(120deg,rgba(122,149,246,.24),rgba(255,255,255,.03));right:-70px;top:-80px}.hero .label{font-size:12px;color:#b9c6e5;position:relative;z-index:1}.hero .amount{font-weight:780;letter-spacing:-1px;font-size:37px;line-height:1.45;font-variant-numeric:tabular-nums;position:relative;z-index:1}.hero .subline{font-size:11px;color:#c3cbe4;display:flex;gap:12px;flex-wrap:wrap;position:relative;z-index:1}.hero b{color:#fff}.section-line{display:flex;align-items:center;justify-content:space-between;margin:21px 2px 10px}.section-line h2{font-size:15px;margin:0;font-weight:790}.section-line small{font-size:11px;color:var(--sub)}.org{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:19px;margin-bottom:11px;overflow:hidden}.org-body{padding:16px 17px 13px}.org-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.org-title{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:760}.dot{height:9px;width:9px;border-radius:3px;background:#6a78d6;display:inline-block}.dot.bb{background:#f4a765}.dot.qc{background:#9f8cdd}.dot.sea{background:#4cbba7}.org-earning{text-align:right}.org-earning .amount{font-size:21px;font-weight:790;letter-spacing:-.5px;font-variant-numeric:tabular-nums}.org-earning .label{color:var(--sub);font-size:10px}.fieldcaption{font-size:11px;color:#9299aa;margin:14px 0 6px}.flowrow{display:flex;align-items:center;border:1px solid #e6eaf2;border-radius:13px;overflow:hidden;background:#fafbff;height:52px}.flowrow .yuan{font-size:19px;padding-left:13px;font-weight:700;color:#8690ab}.flowrow input{background:transparent;border:0;box-shadow:none!important;flex:1;min-width:30px;width:100%;height:48px;padding:0 11px 0 6px;font-size:22px;font-weight:750;letter-spacing:.2px}.flowrow input:focus{border:0}.flowrow input[readonly]{color:#525b71}.flowrow .unit{font-size:11px;color:#9fa6b7;padding:0 10px 0 0}.sea-streams{margin-top:13px}.sea-stream{padding:10px 0}.sea-stream+.sea-stream{border-top:1p ne.highlight strong{color:#5568ca}.row-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px}.row-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.row-head strong{font-size:12px}.row-head button{color:#bf6a69;font-size:11px;border:0;background:transparent}.row-card .detail-grid{gap:9px}.row-card .detail-grid + .detail-grid{margin-top:9px}.row-footer{font-size:11px;color:#66718a;margin-top:10px;border-top:1px dashed #e9edf2;padding-top:9px;display:flex;justify-content:space-between}.add-row{border:1px dashed #c9d0e5;background:#f8f9ff;border-radius:11px;color:#5d70c1;font-weight:700;padding:11px;width:100%;font-size:12px}.extra-row{display:grid;grid-template-columns:1fr 110px 32px;gap:6px;align-items:center;margin:9px 0}.extra-row input{width:100%;padding:9px 10px;font-size:12px}.extra-row button{background:#fff0ef;border:0;color:#be6662;border-radius:9px;height:35px}.extra-caption{display:flex;align-items:center;justify-content:space-between;margin-top:18px}.empty{font-size:11px;color:#a0a8b6;padding:8px 0}.note-box{background:#f0f3ff;border-radius:12px;padding:11px 12px;font-size:11px;line-height:1.7;color:#63709b}.history-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px 16px;margin-bottom:10px}.history-top{display:flex;align-items:center;justify-content:space-between}.history-top strong{font-size:14px}.history-amount{font-size:20px;font-weight:800}.history-bottom{display:flex;gap:9px;justify-content:space-between;margin-top:12px;color:#8e95a6;font-size:11px;flex-wrap:wrap}.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid #eaeef4;display:flex;justify-content:center;padding:10px 14px calc(11px + env(safe-area-inset-bottom));gap:5px;z-index:5}.tabs-inner{max-width:570px;display:flex;flex:1}.tab{flex:1;border:0;background:transparent;text-align:center;font-size:12px;padding:6px;color:#9aa1b0;font-weight:700}.tab.active{color:var(--primary)}.tab .tabicon{display:block;font-size:18px;line-height:20px;margin-bottom:3px}.settings-group{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:12px}.settings-group h3{font-size:14px;margin:0 0 13px}.setting-line{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:12px 0}.setting-line label{font-size:12px;color:#626d83;line-height:1.5;flex:1}.setting-line input{width:100px;text-align:right;padding:8px 9px}.settings-actions{display:flex;gap:8px;flex-wrap:wrap}.settings-actions .btn{flex:1;min-width:115px}.panel{margin:0 0 18px}.hidden{display:none!important}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#293652;color:#fff;border-radius:12px;padding:10px 15px;font-size:12px;z-index:100;max-width:88vw;text-align:center;box-shadow:0 10px 20px #0002}.modalshade{position:fixed;inset:0;background:rgba(18,28,48,.46);z-index:20;display:flex;align-items:flex-end;justify-content:center}.modal{background:#fff;border-radius:22px 22px 0 0;width:min(570px,100%);padding:21px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.modalhead strong{font-size:16px}.modalhead button{border:0;background:#f2f4f8;border-radius:9px;padding:5px 10px}.ocr-preview{max-height:140px;max-width:100%;object-fit:contain;display:block;margin:11px auto;border-radius:10px;border:1px solid var(--line)}.ocr-candidate{display:flex;align-items:center;justify-content:space-between;text-align:left;gap:9px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:white;margin:7px 0;width:100%}.ocr-candidate.active{background:#f0f2ff;border-color:#8190eb}.ocr-candidate .money{font-weight:750;font-size:15px}.ocr-candidate small{color:#8e95a5;font-size:10px;line-height:1.4;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ocr-error{font-size:11px;color:#b56b54;line-height:1.65;margin-top:8px}.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}.inputwide{padding:11px 12px;width:100%}.savetag{font-size:10px;color:#8d95aa}.footnote{font-size:11px;color:#a0a6b4;text-align:center;line-height:1.7;margin:20px 8px 0}#pasteBackup{width:100%;min-height:130px;padding:12px;font-size:12px;line-height:1.5;resize:vertical}.export-total{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--line)}

<body>
<main id="app" class="shell"></main>
<nav class="tabs"><div class="tabs-inner"><button class="tab active" data-action="nav" data-screen="home"><span class="tabicon">▦</span>本月结算</button><button class="tab" data-action="nav" data-screen="history"><span class="tabicon">▤</span>历史记录</button><button class="tab" data-action="nav" data-screen="settings"><span class="tabicon">⚙</span>设置 / 备份</button></div></nav>
<div id="modalhost"></div><div id="toastHost"></div><input type="file" id="shotInput" accept="image/*" class="hidden"><input type="file" id="backupInput" accept=".json,application/json" class="hidden">
<script>
'use strict';
(function(){
const STORAGE='three_guild_income_h5_v1';
const TYPES={new:'新主播',old:'老主播',top:'SS及以上top老主播'};
const ORGS={bb:'大熊文化',qc:'青初',sea:'海上世界'};
const baseRules=()=>({bb:{base:2000,performance:2000,editFee:500,stackThreshold:60000,baseValid:2,perfValid:5,tiers:[{min:60000,pct:1},{min:100000,pct:1.5},{min:200000,pct:2}],growthPrize:[0,1200,1000,800,500,300],recruitPrize:[0,1200,800,500],breakPrize:300},qc:{retentionThreshold:75,new:{base:2,task:2,retention:2,quality:1},old:{base:2,task:1,retention:1,quality:1},top:{base:2,task:1,retention:1,quality:1}},sea:{newRate:20,oldRate:10}});
const curYm=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const copy=x=>JSON.parse(JSON.stringify(x));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const num=v=>Math.max(0,Number(v)||0);
const money=v=>Math.round((Number(v)||0)*100)/100;
const fmt=v=>money(v).toLocaleString('zh-CN',{maximumFractionDigits:2,minimumFractionDigits:0});
const html=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yprev=m=>{const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const ynext=m=>{const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const firstRow=()=>({id:id(),name:'',type:'new',flow:0,days:0,hours:0,share:55,signed:false});
const newMonth=(rules)=>({rules:copy(rules),bb:{flow:0,valid:0,growthRank:0,recruitRank:0,breakApproved:false,prevManual:0,edit:true},qc:{retentionRate:'',rows:[firstRow()]},sea:{newFlow:0,oldFlow:0},extras:[]});
function newState(){const rules=baseRules(),month=curYm();return {v:2,activeMonth:month,defaultRules:rules,months:{[month]:newMonth(rules)}}}
let state;try{state=JSON.parse(localStorage.getItem(STORAGE)||'null')||newState();if(!state?.months||!state?.defaultRules)state=newState()}catch(e){state=newState()}
function migrateState(s){if(Number(s.v)>=2)return s;try{localStorage.setItem(STORAGE+'_old_sea_backup',JSON.stringify(s))}catch(e){}s.defaultRules.sea={newRate:20,oldRate:10};for(const m of Object.values(s.months)){if(!m.rules)m.rules=baseRules();m.rules.sea={newRate:20,oldRate:10};const old=m.sea||{};m.sea={newFlow:num(old.newFlow),oldFlow:num(old.oldFlow??old.flow)}}s.v=2;return s}
state=migrateState(state);
let screen='home',panels={bb:false,qc:false,sea:false},ocr={org:'bb',seaKind:'new',file:null,text:'',candidates:[],selected:0,progress:'',error:''},toastTimeout=null;
function md(){if(!state.months[state.activeMonth])state.months[state.activeMonth]=newMonth(state.defaultRules);return state.months[state.activeMonth]}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));document.querySelectorAll('[data-save-indicator]').forEach(x=>x.textContent='已自动保存')}catch(e){toast('本机存储失败，请立即导出备份')}}
function toast(s){document.getElementById('toastHost').innerHTML='<div class="toast">'+html(s)+'</div>';clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>document.getElementById('toastHost').innerHTML='',2600)}
function extrasBy(m,org){return m.extras.filter(x=>x.org===org).reduce((s,x)=>s+(Number(x.amount)||0),0)}
function bbCalc(m,month){const r=m.rules.bb,b=m.bb,v=num(b.flow),valid=num(b.valid);const stack=v>=r.stackThreshold;const salary=stack?r.base+r.performance:(valid>=r.baseValid||valid>=r.perfValid?Math.max(r.base,r.performance):0);let rate=0;for(const t of r.tiers){if(v>=t.min)rate=t.pct}const commission=money(v*rate/100),edit=b.edit?r.editFee:0,grow=r.growthPrize[Math.min(5,Math.max(0,Number(b.growthRank)||0))]||0,recruit=r.recruitPrize[Math.min(3,Math.max(0,Number(b.recruitRank)||0))]||0;
const pm=state.months[yprev(month)];const previous=pm&&num(pm.bb?.flow)>0?num(pm.bb.flow):num(b.prevManual);const growth=previous>0?(v-previous)/previous*100:null;const breakEligible=!!b.breakApproved&&v<100000&&growth!==null&&growth>10;const breakthrough=breakEligible?r.breakPrize:0;const extra=extrasBy(m,'bb');return {total:money(salary+commission+edit+grow+recruit+breakthrough+extra),flow:v,salary,rate,commission,edit,grow,recruit,breakthrough,extra,previous,growth,breakEligible}}
function qcRowCalc(row,qc,rules){const type=rules[row.type]?row.type:'new';const r=rules[type];const flow=num(row.flow),days=num(row.days),hours=num(row.hours),share=num(row.share);const req=type==='new'?{days:20,hours:100}:type==='old'?{days:25,hours:130}:{days:22,hours:105};const task=flow>=6000&&days>=req.days&&hours>=req.hours;const retention=qc.retentionRate!==''&&Number(qc.retentionRate)>=rules.retentionThreshold;const quality=type==='new'?share<=50:!!row.signed&&share===50;const rate=r.base+(task?r.task:0)+(retention?r.retention:0)+(quality?r.quality:0);return{flow,task,retention,quality,rate,income:money(flow*rate/100)}}
function qcCalc(m){let flow=0,commission=0;const rows=m.qc.rows.map(row=>{const c=qcRowCalc(row,m.qc,m.rules.qc);flow+=c.flow;commission+=c.income;return {...c,id:row.id}});const extra=extrasBy(m,'qc');return {flow,commission:money(commission),extra,total:money(commission+extra),rows}}
function seaCalc(m){const newFlow=num(m.sea.newFlow),oldFlow=num(m.sea.oldFlow),flow=money(newFlow+oldFlow),newIncome=money(newFlow*num(m.rules.sea.newRate)/100),oldIncome=money(oldFlow*num(m.rules.sea.oldRate)/100),base=money(newIncome+oldIncome),extra=extrasBy(m,'sea');return {flow,newFlow,oldFlow,newIncome,oldIncome,base,extra,total:money(base+extra)}}
function summary(m,month){const bb=bbCalc(m,month),qc=qcCalc(m),sea=seaCalc(m);return{bb,qc,sea,total:money(bb.total+qc.total+sea.total),flow:money(bb.flow+qc.flow+sea.flow)}}
function timeBar(){return `<div class="top"><div><div class="eyebrow">PERSONAL CASHFLOW</div><div class="brand">三公会 · 流水随手算</div></div><button class="btn" data-action="open-shot" data-org="bb">识别截图</button></div><div class="monthbar"><button aria-label="上个月" class="arrow" data-action="move-month" data-offset="-1">‹</button><input aria-label="结算月份" class="month-input" type="month" id="monthPick" value="${state.activeMonth}"><button aria-label="下个月" class="arrow" data-action="move-month" data-offset="1">›</button><span class="savetag" data-save-indicator>已自动保存</span></div>`}
function cashFlowField(org,val,readonly){return `<div class="fieldcaption">当月主播流水（元）${readonly?' · 汇总由下方主播明细计算':''}</div><div class="flowrow"><span class="yuan">¥</span><input aria-label="${ORGS[org]}当月流水" data-field="${org==='bb'?'bbFlow':org==='sea'?'seaFlow':'qcSingleFlow'}" type="number" inputmode="decimal" min="0" step="100" placeholder="0" value="${val||''}" ${readonly?'readonly':''}><span class="unit">元</span></div>${!readonly?`<div class="stepbar"><button class="small-action" data-action="step-flow" data-org="${org}" data-step="-1000">− 1000</button><button class="small-action" data-action="step-flow" data-org="${org}" data-step="1000">+ 1000</button><button class="small-action" data-action="step-flow" data-org="${org}" data-step="10000">+ 1万</button><span class="spacer"></span><button class="text-link" data-action="open-shot" data-org="${org}">截图填入</button></div>`:`<div class="stepbar"><span class="muted" style="font-size:11px">已添加多位主播，请在展开的明细中修改流水</span><span class="spacer"></span><button class="text-link" data-action="open-shot" data-org="${org}">截图填入</button></div>`}`}
function seaFlowFields(m,c){return `<div class="sea-streams">${[['new','新主播','seaNewFlow',c.newFlow,c.newIncome,m.rules.sea.newRate],['old','老主播','seaOldFlow',c.oldFlow,c.oldIncome,m.rules.sea.oldRate]].map(([kind,label,field,flow,income,rate])=>`<div class="sea-stream"><div class="sea-stream-top"><strong>${label}流水 <span>· ${fmt(rate)}%</span></strong><span>预计 ¥ <b data-out="sea-${kind}-income">${fmt(income)}</b></span></div><div class="flowrow"><span class="yuan">¥</span><input aria-label="海上世界${label}当月流水" data-field="${field}" type="number" inputmode="decimal" min="0" step="100" placeholder="0" value="${flow||''}"><span class="unit">元</span></div><div class="stepbar"><button class="small-action" data-action="step-flow" data-org="sea" data-sea-kind="${kind}" data-step="-1000">−1000</button><button class="small-action" data-action="step-flow" data-org="sea" data-sea-kind="${kind}" data-step="1000">+1000</button><button class="small-action" data-action="step-flow" data-org="sea" data-sea-kind="${kind}" data-step="10000">+1万</button><span class="spacer"></span><button class="text-link" data-action="open-shot" data-org="sea" data-sea-kind="${kind}">截图填入</button></div></div>`).join('')}</div>`}
function line(label,val,highlight=false){return `<div class="calc-line${highlight?' highlight':''}"><span>${html(label)}</span><strong>${val}</strong></div>`}
function orgCard(org,calc,m){const labels={bb:'大熊文化',qc:'青初',sea:'海上世界'},desc={bb:'统一流水结算 · 底薪 / 绩效 / 提点 / 奖金 / 报销',qc:'仅公司推送主播 · 按新老类别和考核计算 · 无底薪',sea:'新主播 '+fmt(m.rules.sea.newRate)+'% · 老主播 '+fmt(m.rules.sea.oldRate)+'%'};let detail=org==='bb'?renderBBDetails(m,calc):org==='qc'?renderQCDetails(m,calc):renderSeaDetails(m,calc);const field=org==='sea'?seaFlowFields(m,calc):cashFlowField(org,calc.flow,org==='qc'&&m.qc.rows.length!==1);return `<section class="org"><div class="org-body"><div class="org-head"><div class="org-title"><span class="dot ${org}"></span>${labels[org]}</div><div class="org-earning"><div class="label">预计收入</div><div class="amount" data-out="${org}-total">¥ ${fmt(calc.total)}</div></div></div>${field}<div class="org-note">${desc[org]}</div></div><button class="open-detail ${panels[org]?'open':''}" data-action="toggle" data-panel="${org}"><span>${org==='qc'?'主播类别、考核和额外奖励':org==='sea'?'新老主播分成明细与奖励':'考核条件与额外奖励'}</span><span class="chev">›</span></button>${panels[org]?`<div class="details">${detail}${renderExtra(m,org)}</div>`:''}</section>`}
function renderBBDetails(m,c){const b=m.bb;return `<div class="detail-title">大熊月度考核</div><div class="detail-grid"><div class="fgroup"><label>有效新招主播数</label><input data-field="bbValid" type="number" min="0" step="1" value="${b.valid}"></div><div class="fgroup"><label>上月流水（缺少历史数据时）</label><input data-field="bbPrev" type="number" inputmode="decimal" min="0" value="${b.prevManual||''}" placeholder="自动读取上月"></div><div class="fgroup"><label>流水环比增长排名</label><select data-field="bbGrowthRank">${['未获奖','第1名','第2名','第3名','第4名','第5名'].map((x,i)=>`<option value="${i}" ${Number(b.growthRank)===i?'selected':''}>${x}</option>`).join('')}</select></div><div class="fgroup"><label>拉新有效增长排名</label><select data-field="bbRecruitRank">${['未获奖','第1名','第2名','第3名'].map((x,i)=>`<option value="${i}" ${Number(b.recruitRank)===i?'selected':''}>${x}</option>`).join('')}</select></div></div><label class="toggle"><input data-field="bbBreak" type="checkbox" ${b.breakApproved?'checked':''}><span>新人运营突破奖已核实获批（300元；还需流水低于10万且环增超过10%）</span></label><label class="toggle"><input data-field="bbEdit" type="checkbox" ${b.edit?'checked':''}><span>本月可领剪辑报销（${fmt(m.rules.bb.editFee)}元）</span></label><p class="hint">有效新主播：月流水严格大于2000元且开播严格大于10天；小于6万流水时，底薪/绩效按达标的一项2000元处理，达到6万后合并4000元。提点暂按整月流水乘所属档位。</p><div class="calc-list">${line('底薪及绩效','¥ '+fmt(c.salary))}${line('流水提成（'+c.rate+'%）','¥ '+fmt(c.commission))}${line('团队增长排名奖金','¥ '+fmt(c.grow))}${line('拉新增长排名奖金','¥ '+fmt(c.recruit))}${line('新人突破奖励','¥ '+fmt(c.breakthrough))}${line('剪辑报销','¥ '+fmt(c.edit))}${c.growth!==null?line('相对上月流水增长',fmt(c.growth)+'%'):line('相对上月流水增长','暂无上月数据')}</div>`}
function renderQCRow(row,calc,index){return `<div class="row-card"><div class="row-head"><strong>公司推送主播 ${index+1}</strong><button data-action="remove-qc" data-id="${row.id}" ${index===0&&md().qc.rows.length===1?'disabled':''}>删除</button></div><div class="fgroup"><label>主播名称（可空）</label><input data-field="qcName" data-id="${row.id}" value="${html(row.name)}" placeholder="填写昵称"></div><div class="detail-grid" style="margin-top:9px"><div class="fgroup"><label>主播类别</label><select data-field="qcType" data-id="${row.id}">${Object.entries(TYPES).map(([t,x])=>`<option value="${t}" ${row.type===t?'selected':''}>${x}</option>`).join('')}</select></div><div class="fgroup"><label>当月流水（元）</label><input data-field="qcFlow" data-id="${row.id}" type="number" inputmode="decimal" min="0" value="${row.flow||''}" placeholder="0"></div></div><div class="detail-grid"><div class="fgroup"><label>开播天数</label><input data-field="qcDays" data-id="${row.id}" type="number" inputmode="decimal" min="0" value="${row.days||''}" placeholder="0"></div><div class="fgroup"><label>开播小时</label><input data-field="qcHours" data-id="${row.id}" type="number" inputmode="decimal" min="0" value="${row.hours||''}" placeholder="0"></div></div><div class="detail-grid"><div class="fgroup"><label>主播分成（%）</label><input data-field="qcShare" data-id="${row.id}" type="number" min="0" max="100" step="1" value="${row.share}"></div><div class="fgroup"><label>官签情况</label><select data-field="qcSigned" data-id="${row.id}"><option value="0" ${!row.signed?'selected':''}>非官签</option><option value="1" ${row.signed?'selected':''}>官签</option></select></div></div><div class="row-footer"><span data-qc-row-desc="${row.id}">提点 ${fmt(calc.rate)}% · 时长任务${calc.task?'已达标':'未达标'} · 优质${calc.quality?'已达标':'未达标'}</span><strong data-ocr-row="${row.id}">¥ ${fmt(calc.income)}</strong></div></div>`}
function renderQCDetails(m,c){const rate=Number(m.qc.retentionRate);return `<div class="detail-title">青初 · 公司推送主播明细</div><div class="note-box">基础提点：新、老及SS以上top老主播均为2%。时长任务与优质流水会根据开播天数、时长、分成比例、官签情况自动判断；6K留存率为当月团队指标。</div><div class="fgroup" style="margin:13px 0"><label>本月6K留存率（%） · 达${fmt(m.rules.qc.retentionThreshold)}%才增加留存提点</label><input data-field="qcRetention" type="number" step="0.1" min="0" max="100" value="${m.qc.retentionRate}" placeholder="未填写则不计" style="max-width:170px;padding:10px"></div>${m.qc.rows.map((row,i)=>renderQCRow(row,c.rows[i],i)).join('')}<button class="add-row" data-action="add-qc">＋ 添加公司推送主播</button><div class="calc-list">${line('公司推送主播总流水','¥ '+fmt(c.flow))}${line('按主播类别与考核计算的提成','¥ '+fmt(c.commission))}${line('6K留存率考核',m.qc.retentionRate===''?'未填写':fmt(rate)+'%（'+(rate>=m.rules.qc.retentionThreshold?'达标':'未达标')+'）')}</div><p class="hint">新主播时长任务：20天、100小时、流水≥6000；老主播：25天、130小时、流水≥6000；SS以上top老主播：22天、105小时、流水≥6000。新主播分成≤50%加优质奖励；老/top需官签且分成恰为50%。</p>`}
function renderSeaDetails(m,c){return `<div class="detail-title">海上世界 · 新老主播分成</div><div class="calc-list">${line('新主播流水 × '+fmt(m.rules.sea.newRate)+'%','¥ '+fmt(c.newIncome))}${line('老主播流水 × '+fmt(m.rules.sea.oldRate)+'%','¥ '+fmt(c.oldIncome))}${line('流水合计','¥ '+fmt(c.flow))}${line('分成所得','¥ '+fmt(c.base),true)}</div><p class="hint">新、老主播流水分别输入。默认新主播20%，老主播10%，可在设置修改比例；额外奖励和扣款单独记账。</p>`}
function renderExtra(m,org){const items=m.extras.filter(x=>x.org===org);return `<div class="extra-caption"><div class="detail-title" style="margin:0">额外奖励 / 扣款</div><button class="text-link" data-action="add-extra" data-org="${org}">＋ 添加项目</button></div><p class="hint">金额填正数为奖励，填负数为扣款；名称和金额都能随时修改。</p>${items.length?items.map(x=>`<div class="extra-row"><input aria-label="项目名称" data-field="extraName" data-id="${x.id}" value="${html(x.name)}" placeholder="如：主播奖金"><input aria-label="奖励或扣款金额" data-field="extraAmount" data-id="${x.id}" inputmode="decimal" type="number" step="1" value="${x.amount}" placeholder="金额"><button aria-label="删除项目" data-action="remove-extra" data-id="${x.id}">×</button></div>`).join(''):'<div class="empty">暂无额外项目</div>'}`}
function home(){const m=md(),c=summary(m,state.activeMonth);return `${timeBar()}<div class="hero"><div class="label">${html(state.activeMonth.replace('-','年'))}月 · 预计现金收入（含报销）</div><div class="amount" data-out="total">¥ ${fmt(c.total)}</div><div class="subline"><span>三家合计流水：<b data-out="allflow">¥ ${fmt(c.flow)}</b></span><span>按当前考核条件估算</span></div></div><div class="section-line"><h2>流水与收入</h2><small>只填金额，也能先看基础估算</small></div>${orgCard('bb',c.bb,m)}${orgCard('qc',c.qc,m)}${orgCard('sea',c.sea,m)}<div class="footnote">所有数据只保存在当前浏览器。微信清理缓存或更换设备前，请在“设置 / 备份”导出数据。</div>`}
function history(){const months=Object.keys(state.months).sort((a,b)=>b.localeCompare(a));return `<div class="top"><div><div class="eyebrow">MONTHLY HISTORY</div><div class="brand">月度历史记录</div></div><button class="btn" data-action="export-json">备份全部</button></div><div class="note-box" style="margin-bottom:15px">每次输入都会自动保存到对应月份。点开月份可继续修改；每个月的待遇参数独立保存。</div>${months.map(k=>{const c=summary(state.months[k],k);return `<article class="history-card"><div class="history-top"><div><strong>${html(k.replace('-','年'))}月</strong><div class="muted" style="font-size:11px;margin-top:4px">流水 ¥ ${fmt(c.flow)}</div></div><div style="text-align:right"><div class="history-amount">¥ ${fmt(c.total)}</div><div class="muted" style="font-size:10px">预计现金收入</div></div></div><div class="history-bottom"><span>大熊 ¥ ${fmt(c.bb.total)}</span><span>青初 ¥ ${fmt(c.qc.total)}</span><span>海上 ¥ ${fmt(c.sea.total)}</span></div><div style="display:flex;justify-content:flex-end;gap:10px;margin-top:12px"><button class="text-link" data-action="copy-month" data-month="${k}">复制结算摘要</button><button class="btn pale" data-action="go-month" data-month="${k}">查看 / 修改</button></div></article>`}).join('')}`}
function settings(){const m=md(),r=m.rules;return `<div class="top"><div><div class="eyebrow">SETTINGS & BACKUP</div><div class="brand">设置与数据备份</div></div><button class="btn" data-action="nav" data-screen="home">返回结算</button></div><div class="settings-group"><h3>数据安全</h3><p class="hint">离线可计算、按月自动保存。当前版本为单设备本地存储，不会自动同步到另一台手机，也没有服务器储存你的财务数据。</p><div class="settings-actions" style="margin-top:15px"><button class="btn primary" data-action="export-json">导出完整备份</button><button class="btn" data-action="copy-json">复制备份文字</button><button class="btn" data-action="import-json">导入备份</button></div></div><div class="settings-group"><h3>本月待遇参数 · ${html(state.activeMonth)}</h3><p class="hint">改动仅作用于当前月份。其他月份按各自存档规则计算；可将本月规则设为新月份默认。</p>${param('大熊底薪（元）','bb.base',r.bb.base)}${param('大熊绩效（元）','bb.performance',r.bb.performance)}${param('大熊剪辑报销（元）','bb.editFee',r.bb.editFee)}${param('底薪与绩效合并门槛（元）','bb.stackThreshold',r.bb.stackThreshold)}${param('大熊6万档提点（%）','bb.tiers.0.pct',r.bb.tiers[0].pct)}${param('大熊10万档提点（%）','bb.tiers.1.pct',r.bb.tiers[1].pct)}${param('大熊20万档提点（%）','bb.tiers.2.pct',r.bb.tiers[2].pct)}${param('青初6K留存考核线（%）','qc.retentionThreshold',r.qc.retentionThreshold)}${param('青初新主播基础提点（%）','qc.new.base',r.qc.new.base)}${param('青初老主播基础提点（%）','qc.old.base',r.qc.old.base)}${param('青初top老主播基础提点（%）','qc.top.base',r.qc.top.base)}${param('海上新主播提点（%）','sea.newRate',r.sea.newRate)}${param('海上老主播提点（%）','sea.oldRate',r.sea.oldRate)}<button class="btn pale" data-action="save-defaults" style="margin-top:10px;width:100%">以后新建月份使用本月规则</button></div><div class="settings-group"><h3>使用说明</h3><p class="hint">1. 大熊直接填总流水；青初按公司推送的新老主播分别记录；海上在首页分别填写新主播、老主播流水。<br>2. 通过月份选择器切换月份，历史流水会自动保留。<br>3. “截图填入”通过浏览器加载OCR识别库，识别后需要自己确认金额。第一次识别需要网络下载识别组件；在网络受限环境可以直接手动输入。<br>4. 要在微信里通过网页地址打开，需要把本文件放到支持HTTPS的静态网页托管。</p></div><div class="settings-actions"><button class="btn" data-action="copy-month" data-month="${state.activeMonth}">复制本月结算摘要</button><button class="btn" data-action="clear-month">清空当前月份流水</button></div><div class="footnote">版本 2.0 · 海上按新老主播分成 · 无登录、无后端、无第三方数据上传服务</div>`}
function param(label,path,val){return `<div class="setting-line"><label>${html(label)}</label><input aria-label="${html(label)}" data-rule="${path}" type="number" min="0" step="any" value="${html(val)}"></div>`}
function render(){if(screen==='home')document.getElementById('app').innerHTML=home();else if(screen==='history')document.getElementById('app').innerHTML=history();else document.getElementById('app').innerHTML=settings();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.screen===screen))}
function updateStats(){if(screen!=='home')return;const m=md(),c=summary(m,state.activeMonth);const put=(k,v)=>{const el=document.querySelector(`[data-out="${k}"]`);if(el)el.textContent=v};put('total','¥ '+fmt(c.total));put('allflow','¥ '+fmt(c.flow));put('bb-total','¥ '+fmt(c.bb.total));put('qc-total','¥ '+fmt(c.qc.total));put('sea-total','¥ '+fmt(c.sea.total));put('sea-new-income',fmt(c.sea.newIncome));put('sea-old-income',fmt(c.sea.oldIncome));if(m.qc.rows.length===1){const input=document.querySelector('[data-field="qcSingleFlow"]');if(input&&document.activeElement!==input)input.value=m.qc.rows[0].flow||''}else{const input=document.querySelector('[data-field="qcSingleFlow"]');if(input)input.value=c.qc.flow||''}
}
function refreshCalcDetails(){if(screen!=='home')return;const m=md(),c=summary(m,state.activeMonth);for(let i=0;i<m.qc.rows.length;i++){const row=m.qc.rows[i],calc=c.qc.rows[i];const desc=document.querySelector('[data-qc-row-desc="'+row.id+'"]');if(desc)desc.textContent='提点 '+fmt(calc.rate)+'% · 时长任务'+(calc.task?'已达标':'未达标')+' · 优质'+(calc.quality?'已达标':'未达标');const income=document.querySelector('[data-ocr-row="'+row.id+'"]');if(income)income.textContent='¥ '+fmt(calc.income)}}
function getRow(t){return md().qc.rows.find(x=>x.id===t)}
function getExtra(t){return md().extras.find(x=>x.id===t)}
function setField(el,doRender){const f=el.dataset.field,m=md(),value=el.type==='checkbox'?el.checked:el.value,asN=()=>num(value);switch(f){case'bbFlow':m.bb.flow=asN();break;case'seaNewFlow':m.sea.newFlow=asN();break;case'seaOldFlow':m.sea.oldFlow=asN();break;case'qcSingleFlow':if(m.qc.rows.length===1)m.qc.rows[0].flow=asN();break;case'bbValid':m.bb.valid=Math.floor(asN());break;case'bbPrev':m.bb.prevManual=asN();break;case'bbGrowthRank':m.bb.growthRank=+value;break;case'bbRecruitRank':m.bb.recruitRank=+value;break;case'bbBreak':m.bb.breakApproved=value;break;case'bbEdit':m.bb.edit=value;break;case'qcRetention':m.qc.retentionRate=value===''?'':Math.min(100,asN());break;case'qcName':getRow(el.dataset.id).name=value;break;case'qcType':getRow(el.dataset.id).type=value;break;case'qcFlow':getRow(el.dataset.id).flow=asN();break;case'qcDays':getRow(el.dataset.id).days=asN();break;case'qcHours':getRow(el.dataset.id).hours=asN();break;case'qcShare':getRow(el.dataset.id).share=Math.min(100,asN());break;case'qcSigned':getRow(el.dataset.id).signed=value==='1';break;case'extraName':getExtra(el.dataset.id).name=value;break;case'extraAmount':getExtra(el.dataset.id).amount=Number(value)||0;break;default:return}save();if(doRender)render();else{updateStats();refreshCalcDetails()}}
function setRule(path,v){const parts=path.split('.'),m=md();let obj=m.rules;for(let i=0;i<parts.length-1;i++)obj=obj[parts[i]];obj[parts[parts.length-1]]=num(v);save()}
function changeMonth(value){if(!/^\d{4}-\d{2}$/.test(value)||Number(value.slice(5))<1||Number(value.slice(5))>12){toast('请选择有效月份');return}state.activeMonth=value;md();save();render()}
async function copyText(s){try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(s);toast('已复制到剪贴板');return}}catch(e){}const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.top='10px';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();if(ok)toast('已复制到剪贴板');else backupModal(s)}
function monthSummary(k){const s=summary(state.months[k],k);return `${k} 三公会月度收入\n大熊流水 ¥${fmt(s.bb.flow)} / 收入 ¥${fmt(s.bb.total)}（含剪辑报销 ¥${fmt(s.bb.edit)}）\n青初流水 ¥${fmt(s.qc.flow)} / 收入 ¥${fmt(s.qc.total)}\n海上新主播流水 ¥${fmt(s.sea.newFlow)} / 收入 ¥${fmt(s.sea.newIncome)}\n海上老主播流水 ¥${fmt(s.sea.oldFlow)} / 收入 ¥${fmt(s.sea.oldIncome)}\n海上流水合计 ¥${fmt(s.sea.flow)} / 收入 ¥${fmt(s.sea.total)}\n三家流水合计 ¥${fmt(s.flow)}\n预计收入合计 ¥${fmt(s.total)}\n注：根据保存的规则及已填考核数据估算，最终以实际结算为准。`}
function exportBackup(){const json=JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),blob=new Blob([json],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='三公会流水备份_'+state.activeMonth+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已触发导出；微信内若无法下载可使用“复制备份文字”')}
function modalContent(content){document.getElementById('modalhost').innerHTML=`<div class="modalshade" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="弹窗"><div class="modalhead"><strong>${content.title}</strong><button data-action="close-modal">关闭 ×</button></div>${content.html}</div></div>`}
function closeModal(){document.getElementById('modalhost').innerHTML=''}
function backupModal(text){modalContent({title:'复制 / 导入备份',html:`<p class="hint">长按下面文本全选并复制保存。导入时粘贴备份，再点下方按钮。</p><textarea id="pasteBackup" spellcheck="false">${html(text||'')}</textarea><div class="settings-actions" style="margin-top:12px"><button class="btn primary" data-action="restore-paste">导入这段备份</button><button class="btn" data-action="select-backup-file">选择 JSON 文件</button></div>`})}
function importBackup(text){let parsed;try{parsed=JSON.parse(text);if(!parsed?.months||!parsed?.defaultRules||!Object.keys(parsed.months).length)throw new Error('格式错误');if(!/^\d{4}-\d{2}$/.test(parsed.activeMonth))throw new Error('月份错误')}catch(e){toast('备份内容无法识别，请检查是否完整');return}if(!confirm('导入将覆盖当前设备所有流水记录。确定继续吗？'))return;state=migrateState({v:parsed.v||1,activeMonth:parsed.activeMonth,defaultRules:parsed.defaultRules,months:parsed.months});save();closeModal();screen='home';panels={bb:false,qc:false,sea:false};render();toast('备份已恢复')}
function showOCR(){ocr={...ocr,text:'',candidates:[],selected:0,error:'',progress:'请先选择截图'};modalContent({title:'截图识别 · 填入流水',html:`<div class="fgroup"><label>写入哪个公会</label><select id="ocrOrg"><option value="bb" ${ocr.org==='bb'?'selected':''}>大熊文化</option><option value="qc" ${ocr.org==='qc'?'selected':''}>青初</option><option value="sea" ${ocr.org==='sea'?'selected':''}>海上世界</option></select></div><p class="hint">图片只在当前设备识别；自动提取数字后由你确认对应的流水金额，避免误填 UID、房间号或其他数字。</p><div id="ocrImage"></div><div class="settings-actions"><button class="btn pale" data-action="choose-shot">从相册选择图片</button><button class="btn" data-action="run-ocr" id="startOcr" disabled>识别金额</button></div><p id="ocrStatus" class="hint">${ocr.progress}</p><div id="ocrCandidates"></div><div class="fgroup" style="margin-top:13px"><label>确认写入的流水金额（元）</label><input id="ocrAmount" class="inputwide" inputmode="decimal" type="number" min="0" placeholder="也可直接在这里手动输入"></div><div id="ocrRowTarget" style="margin-top:10px"></div><button class="btn primary" data-action="apply-ocr" style="margin-top:12px;width:100%">确认写入本月流水</button><div id="ocrError" class="ocr-error"></div>`})}
function updateOCRTarget(){const sel=document.getElementById('ocrOrg');if(!sel)return;const rows=md().qc.rows;const el=document.getElementById('ocrRowTarget');el.innerHTML=sel.value==='qc'&&rows.length>1?`<div class="fgroup"><label>写入哪个青初主播</label><select id="ocrRowChoice">${rows.map((x,i)=>`<option value="${x.id}">${html(x.name||'公司推送主播 '+(i+1))}</option>`).join('')}</select></div>`:sel.value==='sea'?`<div class="fgroup"><label>海上主播类别</label><select id="ocrSeaChoice"><option value="new" ${ocr.seaKind==='new'?'selected':''}>新主播 · ${fmt(md().rules.sea.newRate)}%</option><option value="old" ${ocr.seaKind==='old'?'selected':''}>老主播 · ${fmt(md().rules.sea.oldRate)}%</option></select></div>`:''}
function showOCRCands(){const container=document.getElementById('ocrCandidates');if(!container)return;container.innerHTML=ocr.candidates.length?`<p class="hint">识别到这些候选金额，请选择真正的“流水”：</p>${ocr.candidates.slice(0,12).map((x,i)=>`<button class="ocr-candidate ${ocr.selected===i?'active':''}" data-action="select-ocr" data-index="${i}"><span class="money">¥ ${fmt(x.amount)}</span><small>${html(x.text.slice(0,55))}</small></button>`).join('')}`:ocr.text?'<p class="hint">未识别到可靠的金额。请根据截图核对并手动输入。</p>':'';}
function parseCandidates(text,lines){let out=[];const source=lines?.length?lines.map(x=>x.text):String(text||'').split(/\n/);for(const raw of source){let line=String(raw||'').trim();if(!line)continue;const re=/(?:[￥¥]\s*)?\d[\d,]*(?:\.\d+)?\s*(?:万|w|W)?/g;let match;while((match=re.exec(line))){let token=match[0].trim(),isWan=/[万wW]$/.test(token);let stripped=token.replace(/[￥¥,\s万wW]/g,'');if(!stripped||stripped.length>11)continue;let value=Number(stripped)*(isWan?10000:1);if(!Number.isFinite(value)||value<=0||value>1e9)continue;const isId=/UID|房间号|房号|房间ID|直播间|开播天数|天数|小时|时长|粉丝数|航海|舰长|用户名|直播间号/i.test(line);let score=0;score+=/流水|营收|流水金额|本月流水|总流水/.test(line)?6:0;score+=/本月|当月|合计|总计/.test(line)?2:0;score+=/[￥¥]|元/.test(line)?2:0;score+=isWan?2:0;score-=isId?8:0;score-=value<200?1:0;score-=/(?:20\d\d[-\/年]\d\d)|(?:UID)|(?:\d{4}-\d{2}-\d{2})/.test(line)?2:0;out.push({amount:money(value),text:line,score})}}
const dedup=new Map();for(const x of out){const key=x.amount.toFixed(2);if(!dedup.has(key)||dedup.get(key).score<x.score)dedup.set(key,x)}return [...dedup.values()].sort((a,b)=>b.score-a.score||b.amount-a.amount).slice(0,16)}
function loadScript(src){return new Promise((res,rej)=>{if(window.Tesseract)return res();const sc=document.createElement('script');sc.src=src;sc.async=true;sc.onload=res;sc.onerror=()=>rej(new Error('识别组件下载失败'));document.head.appendChild(sc)})}
async function runOCR(){if(!ocr.file){toast('请先选择图片');return}const status=document.getElementById('ocrStatus'),btn=document.getElementById('startOcr');btn.disabled=true;status.textContent='加载本地识别组件…';try{if(!window.Tesseract){try{await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js')}catch(e){await loadScript('https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js')}}status.textContent='下载识别语言包并分析图片…首次使用会比较慢';const worker=await window.Tesseract.createWorker('chi_sim+eng',1,{logger:m=>{const el=document.getElementById('ocrStatus');if(el)el.textContent=`图片识别 · ${m.status||'处理中'} ${m.progress?Math.round(m.progress*100)+'%':''}`}});let imageInput=ocr.file;try{imageInput=await shrinkImage(ocr.file)}catch(e){}const result=await worker.recognize(imageInput);await worker.terminate();ocr.text=result.data.text||'';ocr.candidates=parseCandidates(ocr.text,result.data.lines);ocr.selected=0;showOCRCands();const amount=document.getElementById('ocrAmount');if(amount&&ocr.candidates.length)amount.value=ocr.candidates[0].amount;status.textContent=ocr.candidates.length?`识别完成，提取到 ${ocr.candidates.length} 个候选金额，请核对。`:'识别完成，未提取到可用金额；可以直接手动填入。';}catch(e){const el=document.getElementById('ocrError');if(el)el.textContent='自动识别未成功：'+(e.message||'网络或浏览器不支持')+'。你仍可在下方手动填写流水。';status.textContent='截图可供你核对，手动填写金额即可保存。'}finally{if(document.getElementById('startOcr'))document.getElementById('startOcr').disabled=false}}
function shrinkImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const max=1800,scale=Math.min(1,max/Math.max(img.width,img.height));const w=Math.round(img.width*scale),h=Math.round(img.height*scale);const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);resolve(canvas)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('无法读取图像'))};img.src=url})}
function applyOCR(){const org=document.getElementById('ocrOrg')?.value||ocr.org;const input=document.getElementById('ocrAmount');const value=Number(input?.value);if(!input?.value||!Number.isFinite(value)||value<0){toast('请先确认要写入的金额');return}const m=md();if(org==='bb')m.bb.flow=money(value);else if(org==='sea'){const kind=document.getElementById('ocrSeaChoice')?.value||ocr.seaKind||'new';m.sea[kind==='old'?'oldFlow':'newFlow']=money(value)}else{const rid=document.getElementById('ocrRowChoice')?.value;const row=rid?getRow(rid):m.qc.rows[0];if(!row){toast('主播记录不存在');return}row.flow=money(value)}save();closeModal();screen='home';panels[org]=true;render();toast('已写入 '+ORGS[org]+' · '+state.activeMonth)}
function handleAction(a,el){const m=md();switch(a){case'nav':screen=el.dataset.screen;render();window.scrollTo(0,0);break;case'move-month':changeMonth(Number(el.dataset.offset)>0?ynext(state.activeMonth):yprev(state.activeMonth));break;case'go-month':screen='home';changeMonth(el.dataset.month);window.scrollTo(0,0);break;case'toggle':panels[el.dataset.panel]=!panels[el.dataset.panel];render();break;case'step-flow':{const org=el.dataset.org,step=Number(el.dataset.step)||0;if(org==='bb')m.bb.flow=Math.max(0,money(num(m.bb.flow)+step));else if(org==='sea'){const key=el.dataset.seaKind==='old'?'oldFlow':'newFlow';m.sea[key]=Math.max(0,money(num(m.sea[key])+step))}else if(m.qc.rows.length===1)m.qc.rows[0].flow=Math.max(0,money(num(m.qc.rows[0].flow)+step));save();render();break}case'add-qc':m.qc.rows.push(firstRow());save();render();break;case'remove-qc':if(m.qc.rows.length<2)return;if(confirm('删除这名主播的当前月流水记录？')){m.qc.rows=m.qc.rows.filter(x=>x.id!==el.dataset.id);save();render()}break;case'add-extra':m.extras.push({id:id(),org:el.dataset.org,name:'主播奖励',amount:0});save();render();break;case'remove-extra':m.extras=m.extras.filter(x=>x.id!==el.dataset.id);save();render();break;case'save-defaults':state.defaultRules=copy(m.rules);save();toast('已保存为以后新月份的默认规则');break;case'export-json':exportBackup();break;case'copy-json':copyText(JSON.stringify(state));break;case'import-json':backupModal('');break;case'select-backup-file':document.getElementById('backupInput').click();break;case'restore-paste':importBackup(document.getElementById('pasteBackup').value.trim());break;case'copy-month':copyText(monthSummary(el.dataset.month));break;case'clear-month':if(confirm('清空 '+state.activeMonth+' 的流水、考核数据及额外奖励？当前月份的待遇参数将保留。')){const rules=copy(m.rules);state.months[state.activeMonth]=newMonth(rules);save();render();toast('本月数据已清空')}break;case'open-shot':ocr.org=el.dataset.org||'bb';ocr.seaKind=el.dataset.seaKind||'new';showOCR();updateOCRTarget();break;case'choose-shot':document.getElementById('shotInput').click();break;case'run-ocr':runOCR();break;case'select-ocr':ocr.selected=Number(el.dataset.index);document.getElementById('ocrAmount').value=ocr.candidates[ocr.selected].amount;showOCRCands();break;case'apply-ocr':applyOCR();break;case'close-modal':closeModal();break}}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;if(btn.classList.contains('modalshade')&&e.target!==btn)return;if(btn.disabled)return;handleAction(btn.dataset.action,btn)});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.field){setField(el,false)}else if(el.dataset.rule){setRule(el.dataset.rule,el.value)}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='monthPick'){changeMonth(el.value)}else if(el.dataset.field){if(el.type==='checkbox'||el.tagName==='SELECT')setField(el,true);else setField(el,false)}else if(el.id==='ocrOrg'){ocr.org=el.value;updateOCRTarget()}else if(el.dataset.rule){setRule(el.dataset.rule,el.value)}});
document.getElementById('shotInput').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;ocr.file=file;ocr.text='';ocr.candidates=[];const preview=document.getElementById('ocrImage');if(preview){const url=URL.createObjectURL(file);preview.innerHTML=`<img class="ocr-preview" alt="截图预览" src="${url}">`;setTimeout(()=>URL.revokeObjectURL(url),60000)}const status=document.getElementById('ocrStatus');if(status)status.textContent='已选择 '+file.name+'，点击“识别金额”，或直接手动填入金额。';const start=document.getElementById('startOcr');if(start)start.disabled=false;const c=document.getElementById('ocrCandidates');if(c)c.innerHTML='';e.target.value=''});
document.getElementById('backupInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(file)importBackup(await file.text());e.target.value=''});
window.addEventListener('storage',e=>{if(e.key===STORAGE){try{const s=JSON.parse(e.newValue);if(s?.months&&s.defaultRules){state=s;render()}}catch(error){}}});
md();save();render();
})();
</script>
